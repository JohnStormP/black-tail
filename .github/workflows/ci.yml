name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blacktail
          POSTGRES_USER: blacktail
          POSTGRES_PASSWORD: blacktail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blacktail -d blacktail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24
        env:
          CLICKHOUSE_DB: blacktail
          CLICKHOUSE_USER: blacktail
          CLICKHOUSE_PASSWORD: blacktail
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Job runs on the VM, not in a compose network — host is localhost, not "postgres".
      DATABASE_URL: postgresql://blacktail:blacktail@127.0.0.1:5432/blacktail?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: in-memory://
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: blacktail
      CLICKHOUSE_USER: blacktail
      CLICKHOUSE_PASSWORD: blacktail
      MERCURE_URL: http://127.0.0.1/.well-known/mercure
      MERCURE_PUBLIC_URL: http://127.0.0.1/.well-known/mercure
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_JWT_ISSUER: https://localhost
      PAYMENT_WEBHOOK_SECRET: test-payment-webhook-secret
      AI_LLM_BASE_URL: ""
      AI_LLM_API_KEY: ""
      AI_LLM_MODEL: gpt-4o-mini
      AI_ASK_RATE_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, redis
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create test database and migrate
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate --env=test

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Lint Symfony container
        run: php bin/console lint:container
