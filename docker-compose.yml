services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mercure:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-gpt-4o-mini}
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: blacktail
      POSTGRES_USER: blacktail
      POSTGRES_PASSWORD: blacktail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blacktail -d blacktail" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8124:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      CLICKHOUSE_DB: blacktail
      CLICKHOUSE_USER: blacktail
      CLICKHOUSE_PASSWORD: blacktail
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      SERVER_NAME: ':80'
      # Keep in sync with MERCURE_JWT_SECRET in .env / .env.example
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_TRUSTED_ISSUERS: 'https://localhost'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
        playground
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###
volumes:
  postgres_data:
  clickhouse_data:
  mercure_data:
  mercure_config:
