services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: blacktail
      POSTGRES_USER: blacktail
      POSTGRES_PASSWORD: blacktail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blacktail -d blacktail" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8124:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1" ]
    environment:
      CLICKHOUSE_DB: blacktail
      CLICKHOUSE_USER: blacktail
      CLICKHOUSE_PASSWORD: blacktail
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
volumes:
  postgres_data:
  clickhouse_data:
