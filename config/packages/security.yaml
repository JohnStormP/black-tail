security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        identity_user_provider:
            id: App\Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identity_user_provider
            user_checker: App\Identity\Infrastructure\Security\SecurityUserChecker
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Identity\Infrastructure\Security\JsonLoginSuccessHandler
                failure_handler: App\Identity\Infrastructure\Security\JsonLoginFailureHandler
            logout:
                path: /api/logout
                invalidate_session: true
                enable_csrf: false



    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/ready$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/payments/webhooks, roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/tenants, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/wallets, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/bets, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/payments, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/risk-rules, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/analytics, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/ai, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/crash, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            App\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
