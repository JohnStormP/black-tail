framework:
    messenger:
        failure_transport: failed

        buses:
            messenger.bus.default:
                middleware:
                    - App\Shared\Infrastructure\Messenger\LogMessageHandlingMiddleware

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Betting\Application\Message\LogBetPlacedMessage: async
            App\Risk\Application\Message\LogRiskSignalRaisedMessage: async
            App\Analytics\Application\Message\RecordBetPlacedAnalyticsMessage: async
            App\Analytics\Application\Message\RecordBetSettledAnalyticsMessage: async

when@test:
    framework:
        messenger:
            failure_transport: failed
            transports:
                async:
                    dsn: 'in-memory://'
                    retry_strategy:
                        max_retries: 2
                        delay: 0
                        multiplier: 1
                        max_delay: 0
                failed: 'in-memory://'
