doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Tenant:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Tenant/Domain/Entity'
                prefix: 'App\Tenant\Domain\Entity'
                alias: Tenant
            Player:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Player/Domain/Entity'
                prefix: 'App\Player\Domain\Entity'
                alias: Player
            Wallet:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Wallet/Domain/Entity'
                prefix: 'App\Wallet\Domain\Entity'
                alias: Wallet
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Entity'
                prefix: 'App\Identity\Domain\Entity'
                alias: Identity
            Game:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Game/Domain/Entity'
                prefix: 'App\Game\Domain\Entity'
                alias: Game
            Betting:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Betting/Domain/Entity'
                prefix: 'App\Betting\Domain\Entity'
                alias: Betting
            Bonus:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Bonus/Domain/Entity'
                prefix: 'App\Bonus\Domain\Entity'
                alias: Bonus
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Domain/Entity'
                prefix: 'App\Payment\Domain\Entity'
                alias: Payment

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
